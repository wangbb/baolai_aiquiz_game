<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寶來人文共享空間｜影像解謎任務</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <section id="start" class="hero">
    <div class="panel heroText">
      <span class="eyebrow">寶來人文共享空間｜影像解謎任務</span>
      <h1>跟著照片，破解園區的文化密碼</h1>
      <p>你將依序走訪土窯胖、禮盒、窯炊料理、寶來陶、日作染、柴窯、水洗、農產、柴燒灶與雨鏈等 16 個線索點。每一題都需要觀察照片與文字說明，答對才能解鎖下一關。</p>
      <div class="actions"><button class="btn" id="startBtn">開始任務</button><button class="btn secondary" id="continueBtn">繼續進度</button><button class="btn ghost" id="resetBtn1">清除進度</button></div>
    </div>
    <div class="panel heroImg">
      <div class="photoStack"><img src="assets/p01_1.png" alt="土窯胖"><img src="assets/p07_1.png" alt="日作染"><img src="assets/p13_1.png" alt="銅製雨鏈"></div>
      <div class="stamp">玩法：閱讀關卡照片與說明 → 選擇或輸入答案 → 答對後解鎖下一題。進度會自動儲存在這台裝置上。</div>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="topbar"><div class="brand">檨仔腳文化解謎</div><div class="progressText" id="progressText"></div></div>
    <div class="game">
      <aside class="panel map"><h2>關卡地圖</h2><div class="levelGrid" id="levelGrid"></div><div class="legend"><span>● 深色：目前關卡</span><span>● 綠色：已破解</span><span>● 淡色：未解鎖</span></div><div class="footerBtns"><button class="btn ghost" id="homeBtn">回首頁</button><button class="btn ghost" id="resetBtn2">重玩</button></div></aside>
      <main class="panel mainCard"><div class="visual"><img id="qImage" alt="關卡照片"></div><div class="quiz"><div class="meta"><span class="pill" id="qId"></span><span class="pill" id="qCat"></span></div><h2 id="qTitle"></h2><p class="intro" id="qIntro"></p><p class="question" id="qQuestion"></p><div id="answerArea"></div><div class="hint" id="hint"></div><div id="result"></div><div class="footerBtns"><button class="btn secondary" id="hintBtn">提示</button><button class="btn" id="checkBtn">確認答案</button><button class="btn" id="nextBtn">下一關</button></div></div></main>
    </div>
  </section>

  <section id="complete" class="panel complete hidden"><span class="eyebrow">任務完成</span><h2>你破解了寶來的 16 個文化密碼</h2><p>從一份麵包、一只禮盒、一座柴窯、一條雨鏈，看見地方產業、災後重建與社區文化如何被保存下來。</p><div class="actions" style="justify-content:center"><button class="btn" id="againBtn">再玩一次</button><button class="btn secondary" id="reviewBtn">回顧關卡</button></div><div class="record" id="record"></div></section>
</div>
<script src="script.js"></script>
</body>
</html>
